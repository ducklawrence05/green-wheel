services:
    greenwheel-backend:
        container_name: greenwheel-backend
        build:
            context: .
            dockerfile: Dockerfile
        image: greenwheel-backend:prod
        ports:
            - "8080:8080"
        env_file:
            - .env
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
            REDIS_CONFIGURATION: "redis:6379,abortConnect=False"
            Logging__LogLevel__Default: "Information"
            Logging__LogLevel__Microsoft: "Warning"
            Logging__LogLevel__Microsoft.Hosting.Lifetime: "Information"
        depends_on:
            redis:
                condition: service_started
            postgres:
                condition: service_healthy
        volumes:
            - ./logs:/app/logs
        restart: always

    redis:
        container_name: greenwheel-redis-prod
        image: redis:7.0-alpine
        restart: always
        volumes:
            - prod_redis_data:/data

    postgres:
        container_name: greenwheel-postgres-prod
        image: postgres:15-alpine
        restart: always
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - prod_postgres_data:/var/lib/postgresql/data
            - ./init-db:/docker-entrypoint-initdb.d
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    prod_redis_data:
    prod_postgres_data:
