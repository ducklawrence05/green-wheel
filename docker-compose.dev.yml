services:
    greenwheel-backend:
        container_name: greenwheel-backend
        build:
            context: .
            dockerfile: dev.Dockerfile
        ports:
            - "5160:5160"
        env_file:
            - .env
        environment:
            ASPNETCORE_ENVIRONMENT: Development

            DB_CONNECTION_STRING: >
                Host=postgres;
                Port=5432;
                Database=${POSTGRES_DB};
                Username=${POSTGRES_USER};
                Password=${POSTGRES_PASSWORD};

            REDIS_CONFIGURATION: redis:6379

        depends_on:
            redis:
                condition: service_started
            postgres:
                condition: service_healthy

        volumes:
            - .:/src
            - ./logs:/app/logs
            - ~/.nuget/packages:/root/.nuget/packages

        healthcheck:
            test:
                ["CMD-SHELL", "curl -f http://localhost:5160/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5

    # Redis Cache (local)
    redis:
        container_name: greenwheel-redis
        image: redis:7.0-alpine
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - greenwheel_redis_data:/data
        # restart: always

    # PostgreSQL (local)
    postgres:
        container_name: greenwheel-postgres
        image: postgres:15-alpine
        ports:
            - "${POSTGRES_PORT:-5433}:5432"
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - greenwheel_postgres_data:/var/lib/postgresql/data
            - ./init-db:/docker-entrypoint-initdb.d
        # restart: always

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    greenwheel_redis_data:
    greenwheel_postgres_data:
